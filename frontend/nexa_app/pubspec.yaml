name: nexa_app
description: "NEXA — Agentic AI Personal OS Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.0
  provider: ^6.1.0
  google_fonts: ^6.2.0
  animated_text_kit: ^4.2.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.0
  fl_chart: ^0.70.0
  window_manager: ^0.4.0
  shared_preferences: ^2.3.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
